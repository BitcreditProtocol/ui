version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      all-github-actions:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 3
    assignees:
      - "JulianVIE"

  - package-ecosystem: "npm"
    directory: "/"
    groups:
      npm:
        update-types:
          - "patch"
          - "minor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 7
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # Keep Node types aligned with the contributor runtime in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    assignees:
      - "JulianVIE"
