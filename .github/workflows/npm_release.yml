name: npm release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ui-package-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "25"

jobs:
  build:
    name: Build release package
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore the original registry packages
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/package_release.py restore "$RUNNER_TEMP/release-package"

      - name: Install dependencies
        if: steps.package.outputs.restored != 'true'
        run: npm ci

      - name: Build package assets
        if: steps.package.outputs.restored != 'true'
        run: npm run build

      - name: Prepare and verify both registry packages
        if: steps.package.outputs.restored != 'true'
        run: python3 .github/scripts/package_release.py prepare "$RUNNER_TEMP/release-package"

      - name: Save immutable packages before publication
        if: steps.package.outputs.restored != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/
          retention-days: 90
          overwrite: false
          if-no-files-found: error

  publish-npmjs:
    name: Publish to npmjs
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: release-npmjs
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download original registry packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/

      - name: Set up Node.js for npmjs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Reconcile npmjs publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/package_release.py publish "$RUNNER_TEMP/release-package" npmjs

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: release-github
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download original registry packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Reconcile GitHub Packages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/package_release.py publish "$RUNNER_TEMP/release-package" github
